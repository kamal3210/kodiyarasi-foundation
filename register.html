<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Create Account – Kodiyarasi Foundation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Create New Account</h2>

    <form>
        <label>Full Name</label><br>
        <input type="text" placeholder="Enter full name"><br><br>

        <label>Mobile Number</label><br>
        <input type="text" placeholder="Enter mobile number"><br><br>

        <label>Aadhar Number</label><br>
        <input type="text" placeholder="Enter Aadhar"><br><br>

        <label>PAN Number</label><br>
        <input type="text" placeholder="Enter PAN number"><br><br>

        <label>Password</label><br>
        <input type="password" placeholder="Create password"><br><br>

        <button type="submit">Register</button>
    </form>

    <p>Already have account? <a href="login.html">Login here</a></p>

</body>
</html>
